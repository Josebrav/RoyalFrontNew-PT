<!doctype html>
<html lang="es" class="dark">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6569283873873097"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <!-- Fondo oscuro inline, antes que cualquier otra cosa en <head>: sin esto, html/body no
         tienen background propio (index.css no lo define, el bg oscuro real lo pone recien el
         Container de Chakra dentro de App.jsx) y quedan blancos por default del navegador hasta
         que React monta y Tailwind/Chakra terminan de pintar. En rutas de juego eso se nota mucho
         mas: el iframe de Unity (una pagina propia, mucho mas liviana) suele pintar su fondo oscuro
         antes que el shell de React, dejando una franja blanca arriba justo donde deberia estar
         el Nav — el mismo tipo de "invisible en cold load" ya visto en Home.jsx, pero por CSS en
         vez de por una animacion trabada. -->
    <style>html, body { background: #303030; }</style>
    <link rel="icon" type="image/svg+xml" href="/logo.avif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>


    <script>
      // Celular en "modo escritorio": pantalla angosta y tactil pero pagina dibujada a ancho de PC.
      // Agranda la base de texto (ver index.css, html.desktop-on-phone).
      try {
        if (matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 768 && innerWidth >= 900) {
          document.documentElement.classList.add("desktop-on-phone");
        }
      } catch (e) {}
    </script>
    <title>RoyalGames</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // Sitios en inglés/portugués (VITE_SITE_LOCALE) corrigen el lang del documento acá — el
      // atributo estático de arriba queda en "es" (el sitio real en producción) por default.
      const siteLocale = import.meta.env.VITE_SITE_LOCALE;
      if (siteLocale && siteLocale !== "es") {
        document.documentElement.lang = siteLocale;
      }
    </script>
  </body>
</html>
